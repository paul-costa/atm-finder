[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "web"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/paul-costa/atm-finder"
authors = ["Paul Costa"]

[workspace.dependencies]
atm-finder-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The WebAssembly module is built with `--profile wasm`: optimised for size, the tool for speed.
[profile.wasm]
inherits = "release"
opt-level = "z"
