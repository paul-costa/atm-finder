[package]
name = "atm-finder-web"
description = "Browser front end of atm-finder: ATM locations in Austria from OpenStreetMap, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atm-finder-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement",
  "HtmlButtonElement", "Node", "NodeList", "Window", "Navigator", "Storage",
  "DomTokenList", "console", "Location", "History", "UrlSearchParams",
]
