<!doctype html>
<!--
  Page skeleton of the atm-finder website. The WebAssembly module (built from web/src) fills in
  the translated texts (data-i18n attributes), reacts to the form and renders the dynamic parts
  into the elements with ids below. The German texts here are only the fallback while the
  module loads.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bankomaten in Österreich</title>
  <meta name="description" content="Alle Bankomaten einer Gemeinde, eines Bezirks oder Bundeslands in Österreich aus OpenStreetMap, als Karte und Download (CSV, GeoJSON, KML).">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Same fonts as costapaul.com -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a6f97'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3E€%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Look and feel of costapaul.com: dark tiles, Roboto + Roboto Mono, green prompt -->
  <header class="bar">
    <a class="brand" href="https://costapaul.com/"><span class="prompt">~/</span>costapaul<span class="tld">.com</span><span class="path">/atm-finder</span></a>
    <button id="lang-toggle" type="button" class="icon-btn" data-i18n="lang_switch">English</button>
  </header>

  <main>
    <section class="tile hero">
      <span class="cmd">$ atm-finder</span>
      <h1><span data-i18n="title">Bankomaten in Österreich</span><span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </section>

    <!-- Search: place name; the level is picked automatically -->
    <form id="search-form" class="card search" autocomplete="off">
      <label for="place-input" data-i18n="search_label">Ort</label>
      <div class="row">
        <input id="place-input" type="search" required data-i18n-placeholder="search_placeholder" placeholder="z. B. Graz">
        <button id="search-button" type="submit" class="primary" data-i18n="search_button">Suchen</button>
      </div>
    </form>

    <!-- Progress and error messages -->
    <p id="status" class="status" hidden></p>

    <!-- Shown when a name matches several boundaries -->
    <section id="candidates" class="card" hidden>
      <h2 data-i18n="candidates_title">Welches Gebiet?</h2>
      <div id="candidate-list" class="candidates"></div>
    </section>

    <!-- Result: summary, address completion, downloads, map, list -->
    <section id="results" hidden>
      <div class="card">
        <p class="place"><span id="result-place"></span> · <a id="result-osm-link" href="#" target="_blank" rel="noopener">OSM</a> · <button id="share-button" type="button" class="link" data-i18n="copy_link">Link kopieren</button></p>
        <p id="result-summary" class="summary"></p>
        <p id="address-note" class="muted" hidden></p>
        <p class="row">
          <button id="fill-button" type="button" hidden data-i18n="fill_button">Adressen ergänzen</button>
          <span id="fill-progress" class="muted" hidden></span>
        </p>
        <p id="gmaps-row" class="row gmaps-row" hidden>
          <a id="gmaps-list-link" class="gmaps-link" href="#" target="_blank" rel="noopener" hidden></a>
          <button id="gmaps-create" type="button" hidden data-i18n="gmaps_create">Google-Maps-Liste erstellen</button>
          <span id="gmaps-note" class="muted" hidden></span>
        </p>
        <p class="muted touch-only" data-i18n="gmaps_mobile"></p>
        <div id="downloads" hidden>
          <h2 data-i18n="download_title">Download</h2>
          <div class="row">
            <button id="dl-csv" type="button">CSV</button>
            <button id="dl-geojson" type="button">GeoJSON</button>
            <button id="dl-kml" type="button">KML</button>
          </div>
          <p class="muted" data-i18n="download_hint"></p>
        </div>
      </div>
      <div id="map" class="map" aria-label="Karte"></div>
      <details id="list" class="card" hidden>
        <summary><span data-i18n="list_title">Liste</span> (<span id="list-count">0</span>)</summary>
        <ul id="atm-items" class="atm-list"></ul>
      </details>
    </section>

    <!-- Exports from data/, listed from data/index.json -->
    <section id="ready" class="card" hidden>
      <h2 data-i18n="ready_title">Fertige Dateien</h2>
      <p class="muted" data-i18n="ready_intro"></p>
      <ul id="ready-list" class="ready-list"></ul>
      <p class="muted touch-only" data-i18n="gmaps_mobile"></p>
    </section>

  </main>

  <footer>
    <p data-i18n="footer"></p>
    <p class="foot-row"><span>© 2026 <a href="https://costapaul.com/">Paul Costa</a></span><span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://github.com/paul-costa/atm-finder" target="_blank" rel="noopener">source</a></span></p>
  </footer>

  <!-- Leaflet (vendored), the glue it needs, then the WebAssembly module -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="map.js"></script>
  <script type="module">
    import init from "./pkg/atm_finder_web.js";
    init().catch((error) => {
      const status = document.getElementById("status");
      status.hidden = false;
      status.textContent = "WebAssembly konnte nicht geladen werden / failed to load: " + error;
    });
  </script>
</body>
</html>
